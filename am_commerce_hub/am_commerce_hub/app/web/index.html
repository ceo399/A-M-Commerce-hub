<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A&M Commerce Hub — v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--sans:"Noto Sans JP",sans-serif;--gold:#8a6c16;--bg:#f3f1ea;--ink:#26241f}
  *{box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);margin:0}
  .container{max-width:1400px;margin:0 auto;padding:20px}
  .header{font-size:28px;font-weight:700;margin:8px 0 20px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;border-bottom:2px solid #ddd;margin-bottom:24px}
  .tab{padding:12px 18px;background:transparent;border:0;border-bottom:3px solid transparent;
       cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:#777;margin-bottom:-2px}
  .tab:hover{color:var(--gold)}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold)}
  .panel{background:#fff;border:1px solid #ddd;border-radius:8px;padding:32px;min-height:320px}
  .panel-title{font-size:20px;font-weight:700;margin:0 0 8px}
  .panel-sub{color:#999;font-size:13px;margin:0 0 28px}
  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
               padding:60px 20px;color:#b3a98f;border:2px dashed #e2dcc9;border-radius:8px}
  .placeholder .icon{font-size:40px;margin-bottom:12px}
  .placeholder .badge{font-size:13px;font-weight:600;color:var(--gold);
                      background:#f7f1df;border-radius:999px;padding:6px 16px;margin-top:14px}
  .footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #ddd;color:#999;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <div class="header">📊 A&M Commerce Hub — v2</div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
  <div class="footer">A&M Commerce Hub v2.0 — 基盤起動済み（各機能は順次実装）</div>
</div>
<script>
  const TABS = [
    {key:"sales-ads",   icon:"💰", title:"売上 × 広告",          sub:"売上・ROAS・広告パフォーマンスの統合ビュー"},
    {key:"reg-report",  icon:"📋", title:"登録状態レポート",      sub:"商品の出品・カタログ登録ステータス一覧"},
    {key:"forecast-po", icon:"📦", title:"発注予測 + 発注書",     sub:"需要予測にもとづく発注提案と発注書発行"},
    {key:"seo-crawl",   icon:"🔍", title:"SEOクロール + 修正",    sub:"リスティングのSEO診断と改善提案"},
    {key:"lifecycle",   icon:"♻️", title:"製品ライフサイクル管理", sub:"商品の登録から終売までのライフサイクル"},
  ];
  let active = TABS[0].key;
  const tabsEl = document.getElementById("tabs");
  const contentEl = document.getElementById("content");

  function render(){
    tabsEl.innerHTML = "";
    TABS.forEach(t=>{
      const b = document.createElement("button");
      b.className = "tab" + (t.key===active ? " active" : "");
      b.textContent = t.icon + " " + t.title;
      b.onclick = ()=>{ active = t.key; render(); };
      tabsEl.appendChild(b);
    });
    const t = TABS.find(x=>x.key===active);
    contentEl.innerHTML =
      '<div class="panel">' +
        '<h2 class="panel-title">'+t.icon+' '+t.title+'</h2>' +
        '<p class="panel-sub">'+t.sub+'</p>' +
        '<div class="placeholder">' +
          '<div class="icon">'+t.icon+'</div>' +
          '<div>このタブの機能は現在準備中です</div>' +
          '<div class="badge">🚧 準備中</div>' +
        '</div>' +
      '</div>';
  }
  render();
</script>
</body>
</html>
